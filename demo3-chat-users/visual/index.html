<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carry Your Memory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a presenter stage. Memory store on the left (the wall of Polaroids), the chat on the right. One step per strategy. */
:root{
  --bg:#edecec; --panel:#fffdf8; --ink:#2b1b17; --muted:#6b5a52; --line:#d9d2cc;
  --maroon:#7a0000; --green:#1f4d3a; --cream:#f6e3c0; --amber:#a86a00;
  --bar:#cbbfb6; --hit:#7a0000; --userb:#2b1b17; --userf:#f6e3c0; --botb:#ffffff;
  --ok:#1f6b45; --okbg:#e3f1e8; --bad:#a3201a; --badbg:#fbe9e7; --meh:#8a5a00; --mehbg:#fbf0dc;
  --display:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1311; --panel:#241b18; --ink:#f3e9e2; --muted:#b9a79d; --line:#3d302b;
  --maroon:#e0605a; --green:#6fbf95; --cream:#f6e3c0; --amber:#e3a63a;
  --bar:#4a3b35; --hit:#e0605a; --userb:#f6e3c0; --userf:#2b1b17; --botb:#2f2420;
  --ok:#7fd3a3; --okbg:#1d3328; --bad:#ff8a80; --badbg:#3a1f1c; --meh:#f0c06a; --mehbg:#3a2e18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1311; --panel:#241b18; --ink:#f3e9e2; --muted:#b9a79d; --line:#3d302b;
  --maroon:#e0605a; --green:#6fbf95; --cream:#f6e3c0; --amber:#e3a63a;
  --bar:#4a3b35; --hit:#e0605a; --userb:#f6e3c0; --userf:#2b1b17; --botb:#2f2420;
  --ok:#7fd3a3; --okbg:#1d3328; --bad:#ff8a80; --badbg:#3a1f1c; --meh:#f0c06a; --mehbg:#3a2e18; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1440px;margin:0 auto;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--body);font-size:16px;font-weight:600;letter-spacing:0;color:var(--maroon)}
h1{font-family:var(--display);font-size:clamp(24px,3vw,36px);margin:0;line-height:1.1;text-wrap:balance}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{font:600 13px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
.steps button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps button:focus-visible,.btn:focus-visible,.guess button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel h2{font-family:var(--display);font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.formula{font-family:var(--mono);font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:inline-block;margin-bottom:12px}

.mem{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:92px minmax(0,1fr) 150px;gap:12px;align-items:center;padding:9px 10px;border-radius:10px;border:1px solid transparent;transition:background .3s,border-color .3s,opacity .3s}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.row .date{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .txt{font-size:15px;min-width:0}
.row .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px;padding:1px 6px;border-radius:4px;vertical-align:2px}
.tag.stale{background:var(--badbg);color:var(--bad)}
.tag.fresh{background:var(--okbg);color:var(--ok)}
.meter{display:flex;align-items:center;gap:8px}
.track{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.fill{display:block;height:100%;width:0;background:var(--bar);border-radius:6px;transition:width .6s ease}
.score{font-family:var(--mono);font-size:13px;width:44px;text-align:right;font-variant-numeric:tabular-nums}
.row.hit{background:color-mix(in srgb,var(--hit) 8%,transparent);border-color:color-mix(in srgb,var(--hit) 45%,transparent)}
.row.hit .fill{background:var(--hit)}
.row.dim{opacity:.45}
.rank{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--hit);color:var(--bg);font:700 11px var(--mono);margin-right:6px;vertical-align:1px}

.facts{width:100%;border-collapse:collapse;font-size:15px}
.facts th,.facts td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.facts th{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts td.k{font-family:var(--mono)}
.facts tr.old td{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.pill{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.cur{background:var(--okbg);color:var(--ok)}
.pill.until{background:var(--badbg);color:var(--bad);text-decoration:none;display:inline-block}
.sql{font-family:var(--mono);font-size:13px;margin-top:12px;color:var(--muted)}

.chat{display:flex;flex-direction:column;gap:12px}
.bubble{max-width:88%;padding:12px 16px;border-radius:16px;font-size:17px}
.user{align-self:flex-end;background:var(--userb);color:var(--userf);border-bottom-right-radius:4px;font-weight:500}
.bot{align-self:flex-start;background:var(--botb);border:1px solid var(--line);border-bottom-left-radius:4px}
.who{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ctx{border:1px dashed var(--line);border-radius:12px;padding:12px}
.ctx .who{margin-bottom:8px}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{font-size:14px;padding:6px 10px;border-radius:8px;background:var(--bg);border-left:4px solid var(--bar)}
.chip.stale{border-left-color:var(--bad)}
.chip.fresh{border-left-color:var(--ok)}
.chip.noise{border-left-color:var(--amber)}
.guess{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--amber) 10%,transparent);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent)}
.guess strong{font-family:var(--display);font-size:18px}
.guess .opts{display:flex;flex-wrap:wrap;gap:8px}
.guess button{font:600 15px var(--body);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.guess button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.verdict{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;font-size:15px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.bad{background:var(--badbg);color:var(--bad)}
.verdict.meh{background:var(--mehbg);color:var(--meh)}
.verdict b{font-family:var(--display);font-size:18px}
.yourguess{font-size:14px;color:var(--muted)}
.ghajini{font-style:italic;font-weight:600;color:var(--maroon);font-size:16px}
.note{font-size:12px;color:var(--muted)}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btn{font:600 15px var(--body);padding:10px 18px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.keys{font-size:13px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}

.board{width:100%;border-collapse:collapse;font-size:16px}
.board th,.board td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.board th{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.board td:first-child{font-family:var(--display);font-weight:700}
.tablebox{overflow-x:auto}
body.shot .controls{display:none}
.fadein{animation:fade .45s ease both}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){body.shot .controls{display:none}
.fadein{animation:none}.fill,.row{transition:none}}
.stack{display:flex;flex-direction:column;gap:12px}
.code{background:#2b1b17;color:#f6e3c0;border-radius:10px;padding:12px 0;font-family:var(--mono);font-size:13.5px;line-height:1.55;overflow-x:auto}
.code .l{display:flex;gap:10px;align-items:baseline;padding:0 14px;white-space:pre;min-height:1.55em}
.code .l.hl{background:rgba(111,191,149,.18);box-shadow:inset 3px 0 0 #6fbf95}
.code .l.bad{background:rgba(224,96,90,.2);box-shadow:inset 3px 0 0 #e0605a}
.code .src{margin-left:auto;font-style:normal;font-family:var(--body);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:#6fbf95;color:#16241c;white-space:nowrap}
.code .l.bad .src{background:#e0605a;color:#2b0b09}
.code .c{color:#b9a79d}
.filehead{font-family:var(--mono);font-size:12px;color:var(--muted);margin:10px 0 6px;letter-spacing:.04em}
.tree{font-family:var(--mono);font-size:14px;line-height:1.7;white-space:pre;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;overflow-x:auto}
.tree b{color:var(--maroon)}
.term{align-self:stretch;background:#2b1b17;color:#f6e3c0;border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.55}
.term .p{color:#6fbf95}.term .d{color:#b9a79d}
.tag2{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.loaded{display:flex;flex-direction:column;gap:8px}
.loaded .it{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-family:var(--mono);font-size:14px}
.loaded .it.new{border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:var(--okbg)}
.loaded .it.off{opacity:.45;border-style:dashed}
.capsule{font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.chatlabel{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
</style>
<div class="wrap">
  <header><div class="brand"><span class="eyebrow">Demo 3 · Claude and ChatGPT users</span><h1 id="title"></h1></div><nav class="steps" id="steps" aria-label="Demo steps"></nav></header>
  <main class="stage"><section class="panel" id="left" aria-live="polite"></section><section class="panel chat" id="right" aria-live="polite"></section></main>
  <div class="controls"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="prev">← Back</button><button class="btn" id="reveal">Reveal answer</button><button class="btn ghost" id="next">Next →</button></div>
  <span class="keys"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>Space</kbd> reveal · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> pick the room's guess</span></div>
</div>
<script>
const U=(t,who="You")=>`<div class="bubble user"><div class="who" style="color:inherit;opacity:.7">${who}</div>${t}</div>`;
const B=(t,who="Claude")=>`<div class="bubble bot"><div class="who">${who}</div>${t}</div>`;
const NB=(rows,empty)=>`<div class="filehead">Memory notebook · semantic facts</div>${empty?`<div class="capsule" style="color:var(--muted)">Empty. This chat knows nothing about you.</div>`:`<div class="tablebox"><table class="facts"><thead><tr><th>key</th><th>value</th><th>state</th></tr></thead><tbody>${rows}</tbody></table></div>`}`;
const R=(k,v,st,old)=>`<tr class="${old?'old':''}"><td class="k">${k}</td><td>${v}</td><td><span class="pill ${old?'until':'cur'}">${st}</span></td></tr>`;
const F3=R("diet","vegetarian","current")+R("allergy (son)","peanuts","current");
const F_DELHI=F3+R("city","Delhi","current");
const F_PUNE=F3+R("city","Delhi","until 2026-11-20",true)+R("city","<b>Pune</b>","current");
const CAP=`=== MEMORY CAPSULE v1 · updated 2026-11-20 ===
Instructions for the assistant: treat this as the user's saved
memory. Use it silently. Current facts win over superseded ones.

FACTS (current)
- diet: vegetarian  [since 2026-11-20]
- allergy (son): peanuts  [since 2026-11-20]
- city: Pune  [since 2026-11-20]

FACTS (superseded)
- city: Delhi  [→ 2026-11-20]

RECENT EPISODES
- 2026-11-20: told me they moved from Delhi to Pune
=== END CAPSULE ===`;
const NOTE=`<p class="note">Illustration of the memory-notebook skill from agent-memory-kit/demo3-chat-users.</p>`;
const STEPS=[
{tab:"The stranger",title:"Every new chat is a stranger",
 left:`<p class="sub">No memory skill yet. A brand-new chat.</p>${NB("",true)}`,
 right:`<div class="chatlabel"><span>New chat</span><span class="tag2">no memory</span></div>${U("Book a team dinner near me tonight.")}`,
 guess:{q:"What does it know about me?",opts:["My city and diet","Nothing"]},
 answer:B("Happy to help! Which city are you in, how many people, and any dietary needs?")+`<div class="verdict bad"><b>Nothing.</b>You've told it all of this before, in other chats. You'll tell it again.</div><p class="ghajini">Ghajini: fifteen minutes later, everyone is a stranger again.</p>`},
{tab:"1 · Remember",title:"Tell it once",
 left:`<p class="sub">The memory-notebook skill is installed. Facts are saved as key and value.</p>${NB(F_DELHI)}`,
 right:`<div class="chatlabel"><span>Chat 1</span><span class="tag2">memory-notebook on</span></div>${U("Remember: I'm vegetarian, my son is allergic to peanuts, and I live in Delhi.")}${B("Saved: diet = vegetarian · allergy (son) = peanuts · city = Delhi")}`},
{tab:"2 · I moved",title:"Facts change",
 left:`<p class="sub">What happens to Delhi?</p>${NB(F_DELHI)}`,
 right:`<div class="chatlabel"><span>Chat 1</span><span class="tag2">memory-notebook on</span></div>${U("Actually, we moved to Pune.")}`,
 guess:{q:"What happens to Delhi?",opts:["Deleted","Both stay current","Kept as history"]},
 answer:B("Saved: city = Pune (was Delhi)")+`<div class="verdict ok"><b>Kept as history.</b>Delhi is crossed out with an end date, not deleted. Pune is the only current city.</div>`,
 after:NB(F_PUNE)+`<p class="ghajini">Ghajini: cross out the old page, write the new truth below.</p>`},
{tab:"3 · I'm starving",title:"Not everything is a memory",
 left:`<p class="sub">The skill asks one question before saving: will this still be true next week?</p>${NB(F_PUNE)}`,
 right:`<div class="chatlabel"><span>Chat 1</span><span class="tag2">memory-notebook on</span></div>${U("I'm starving.")}`,
 guess:{q:"Will it save “I'm starving”?",opts:["Yes","No"]},
 answer:B("Time for a snack! I won't save that one, it's a mood, not a fact.")+`<div class="verdict ok"><b>Not saved.</b>Moods, one-off requests, passwords and card numbers never go in the notebook.</div><p class="ghajini">Ghajini: not everything goes in the notebook. Only what he'll need when he wakes up again.</p>`},
{tab:"4 · Save memory",title:"Pack it into a capsule",
 left:`<p class="sub">In the chat app there's no folder to write to, so the notebook travels as text you keep.</p><div class="filehead">MEMORY CAPSULE</div><div class="capsule">${CAP}</div>`,
 right:`<div class="chatlabel"><span>Chat 1</span><span class="tag2">memory-notebook on</span></div>${U("Save memory")}${B("Here's your memory capsule. Paste it into any new chat, or into a Project's instructions so it loads every time.")}<div class="verdict ok"><b>Under 400 words.</b>Current facts, superseded facts with dates, recent episodes.</div>`},
{tab:"5 · New chat",title:"A new chat that knows you",
 left:`<p class="sub">Brand-new chat. Paste the capsule first.</p><div class="capsule">${CAP}</div>`,
 right:`<div class="chatlabel"><span>New chat</span><span class="tag2">capsule pasted</span></div>${U("[capsule] Book a team dinner near me tonight.")}`,
 guess:{q:"What will it suggest?",opts:["Anything in Delhi","Veg, peanut-free, in Pune","It asks again"]},
 answer:B("Here are three pure-vegetarian places in Pune for tonight. I've skipped anywhere that cooks with peanuts, and flagged one that can do a nut-free kitchen. How many people?")+`<div class="verdict ok"><b>Same AI. No longer a stranger.</b>Vegetarian, peanut-free, and Pune, not Delhi.</div>`,after:NOTE},
{tab:"6 · Any assistant",title:"Your memory, not the app's",
 left:`<p class="sub">The capsule is plain text, so any assistant can read it.</p><div class="capsule">${CAP}</div>`,
 right:`<div class="chatlabel"><span>Another assistant · e.g. ChatGPT</span><span class="tag2">capsule pasted</span></div>${U("[capsule] Book a team dinner near me tonight.")}`,
 guess:{q:"Different app. Will it still know?",opts:["Yes","No"]},
 answer:B("Sure. Vegetarian, peanut-free options in Pune for tonight…","Assistant")+`<div class="verdict ok"><b>Yes.</b>Your memory moves with you between chats and between apps.</div><p class="ghajini">Ghajini: the Polaroids travel with him. Your capsule travels with you, to any chat.</p>`},
{tab:"Take it home",title:"Install it in 2 minutes",
 left:`<p class="sub">Three ways to use it.</p><div class="tablebox"><table class="board"><thead><tr><th>Where</th><th>How</th></tr></thead><tbody>
 <tr><td>Claude app</td><td>Settings → Capabilities → Skills → upload memory-notebook.zip</td></tr>
 <tr><td>Claude Code</td><td>Copy memory-notebook/ into ~/.claude/skills/</td></tr>
 <tr><td>ChatGPT, others</td><td>Paste the capsule into custom or Project instructions</td></tr></tbody></table></div>`,
 right:`<div class="bubble bot"><div class="who">Commands</div>“remember …” · “forget …” · “what do you remember?” · “save memory”</div><p class="ghajini">Don't be Ghajini. Write it down, version it, and read it back.</p><p class="note">agent-memory-kit/demo3-chat-users</p>`},
];

let step=0;const guesses={},revealed={};
const $=s=>document.querySelector(s);
function renderSteps(){$("#steps").innerHTML=STEPS.map((s,i)=>`<button type="button" data-i="${i}" ${i===step?'aria-current="step"':''}>${s.tab}</button>`).join("");$("#steps").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.i));}
function guessBlock(s){const g=guesses[step];return `<div class="guess"><strong>${s.guess.q}</strong><div class="opts">${s.guess.opts.map((o,i)=>`<button type="button" data-g="${i}" aria-pressed="${g===i}">${o}</button>`).join("")}</div></div>`;}
function render(){const s=STEPS[step];renderSteps();
 $("#prev").disabled=step===0;$("#next").disabled=step===STEPS.length-1;
 $("#reveal").hidden=!s.guess;$("#reveal").textContent=revealed[step]?"Hide answer":"Reveal answer";
 $("#title").textContent=s.title;
 $("#left").innerHTML=s.left;
 let r=s.right||"";
 if(s.guess){ if(revealed[step]){ r+=`<div class="fadein stack">${s.answer}</div>`; if(guesses[step]!==undefined) r+=`<div class="yourguess fadein">The room guessed: <b>${s.guess.opts[guesses[step]]}</b></div>`; if(s.after) r+=`<div class="fadein stack">${s.after}</div>`;} else r+=guessBlock(s);} else if(s.answer) r+=s.answer;
 $("#right").innerHTML=r;
 $("#right").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{guesses[step]=+b.dataset.g;render();});}
function go(i){step=Math.max(0,Math.min(STEPS.length-1,i));render();}
function toggleReveal(){if(!STEPS[step].guess)return;revealed[step]=!revealed[step];render();}
$("#prev").onclick=()=>go(step-1);$("#next").onclick=()=>go(step+1);$("#reveal").onclick=toggleReveal;
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){go(step+1);e.preventDefault();}else if(e.key==="ArrowLeft"){go(step-1);e.preventDefault();}else if(e.key===" "){toggleReveal();e.preventDefault();}else if(/^[1-4]$/.test(e.key)){const s=STEPS[step];if(s.guess&&!revealed[step]&&+e.key<=s.guess.opts.length){guesses[step]=+e.key-1;render();}}});
if(location.hash==="#shot")document.body.classList.add("shot");
render();

</script>
